<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><script>/*zoomlock*/(function(){var d=document,p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){d.addEventListener(t,p)});d.addEventListener('touchmove',function(e){if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});d.addEventListener('dblclick',p);d.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});d.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>=0)e.preventDefault()})})();</script><style>html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
<title>بەرد، کاغەز، مقەست</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4efe8;--card:#fffdf9;--ink:#2a2420;--mute:#7a6e64;--acc:#9c3d2e;--line:#e2d8cb;--sel:#f3dfd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1816;--card:#26211e;--ink:#f1e9e0;--mute:#a79a8d;--acc:#d9644f;--line:#3a322d;--sel:#43302b}}
:root[data-theme="dark"]{--bg:#1c1816;--card:#26211e;--ink:#f1e9e0;--mute:#a79a8d;--acc:#d9644f;--line:#3a322d;--sel:#43302b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn','Noto Naskh Arabic',Tahoma,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:8px 0 4px;text-align:center}
.sub{color:var(--mute);text-align:center;font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input{width:100%;padding:13px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;margin-top:16px}
.btn:disabled{opacity:.4}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.score{display:flex;justify-content:space-between;align-items:center;text-align:center;margin-bottom:14px;gap:8px}
.score div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-size:13px;color:var(--mute)}
.score b{display:block;font-size:24px;color:var(--ink)}
.gname{text-align:center;font-weight:800;font-size:18px;margin-bottom:10px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.pick{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 4px 10px;color:var(--ink)}
.pick.sel{border-color:var(--acc);background:var(--sel)}
.pick svg{width:100%;height:auto;display:block}
.pick span{font-size:14px;font-weight:600}
.center{text-align:center}
.big{font-size:20px;font-weight:800;margin:6px 0}
.count{font-size:140px;font-weight:800;color:var(--acc);text-align:center;line-height:1.3;animation:pop .8s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;animation:rise .5s ease}
.vs .side.win{border-color:var(--acc);border-width:2px}
.vs svg{width:100%;height:auto;display:block}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.res{font-size:24px;font-weight:800;margin:18px 0 4px;text-align:center}
.why{color:var(--mute);text-align:center;margin:0 0 4px}
:root:root{--bg:#0f1b24;--card:#17262f;--ink:#f3ece0;--mute:#97a8b2;--acc:#e6b04a;--line:#2b3f4c;--sel:#2a3b3f}
body{background:radial-gradient(130% 70% at 50% 0%,#24475b 0%,#12222c 55%,#0b141b 100%) fixed;color:var(--ink)}
main{padding-top:30px}
h1{font-size:32px;font-weight:800;margin-bottom:6px;background:linear-gradient(180deg,#f7d98a,#d9a038);-webkit-background-clip:text;background-clip:text;color:transparent}
h1::after{content:'';display:block;width:64px;height:3px;border-radius:3px;margin:12px auto 0;background:linear-gradient(90deg,transparent,#e6b04a,transparent)}
.sub{margin-top:14px}
.card{background:linear-gradient(180deg,#1c3140,#15242e);border:1px solid #2d4352;border-radius:24px;padding:22px 18px;box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
input{background:#0e1a22;border:1px solid #2d4352;border-radius:14px;padding:15px}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.btn{background:linear-gradient(180deg,#f3c25a,#d29327);color:#2b1d06;border-radius:16px;padding:16px;font-weight:800;box-shadow:0 8px 20px rgba(230,176,74,.28);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:none;border:1px solid #3a5263}
.btn:disabled{box-shadow:none;filter:grayscale(.6)}
.gname{font-size:17px;color:var(--acc);letter-spacing:.5px}
.score{gap:10px}
.score div{background:linear-gradient(180deg,#1c3140,#15242e);border:1px solid #2d4352;border-radius:18px;padding:10px 6px;font-size:14px;color:var(--ink)}
.score b{font-size:30px;color:var(--acc);margin-top:2px}
.pick{border-radius:20px;border:1px solid #2d4352;background:radial-gradient(circle at 50% 30%,#2c4a5a,#14232c);padding:10px 4px 12px;transition:transform .18s,box-shadow .18s}
.pick span{display:block;margin-top:4px;color:var(--ink)}
.pick.sel{transform:translateY(-6px);border-color:var(--acc);background:radial-gradient(circle at 50% 30%,#5a4a24,#1c2a2e);box-shadow:0 0 0 2px var(--acc),0 14px 26px rgba(230,176,74,.25)}
.count{color:var(--acc);text-shadow:0 0 50px rgba(230,176,74,.55);padding:30px 0}
.vs{gap:12px}
.vs .side{background:radial-gradient(circle at 50% 30%,#2c4a5a,#14232c);border:1px solid #2d4352;border-radius:22px;padding:12px 8px}
.vs .side.win{border:2px solid var(--acc);box-shadow:0 0 34px rgba(230,176,74,.45)}
.vs .side.lose{opacity:.55;filter:saturate(.6)}
.res{font-size:28px;color:var(--acc);margin-top:22px}
.why{margin-bottom:6px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var S={step:'setup',group:'',n:['',''],score:[0,0],pick:[null,null],cur:0,sel:null};
var NAME={rock:'بەرد',paper:'کاغەز',scissors:'مقەست'};
var SK='#e9b68f',ST='#a9714a',SH='#d49c74';

function hand(t){
  var a='fill="'+SK+'" stroke="'+ST+'" stroke-width="3" stroke-linejoin="round"';
  var b='fill="none" stroke="'+SH+'" stroke-width="2.5" stroke-linecap="round"';
  var s='<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">';
  if(t==='paper'){
    s+='<rect x="36" y="118" width="22" height="64" rx="11" transform="rotate(-38 47 150)" '+a+'/>';
    s+='<rect x="58" y="42" width="21" height="110" rx="10.5" '+a+'/>';
    s+='<rect x="81" y="22" width="21" height="130" rx="10.5" '+a+'/>';
    s+='<rect x="104" y="28" width="21" height="124" rx="10.5" '+a+'/>';
    s+='<rect x="127" y="52" width="19" height="100" rx="9.5" '+a+'/>';
    s+='<rect x="56" y="120" width="90" height="96" rx="30" '+a+'/>';
    s+='<path d="M80 150v20M104 148v22M126 152v18" '+b+'/>';
    s+='<rect x="66" y="212" width="70" height="22" rx="6" fill="'+SH+'" stroke="'+ST+'" stroke-width="3"/>';
  }else if(t==='rock'){
    s+='<rect x="48" y="96" width="104" height="116" rx="38" '+a+'/>';
    for(var i=0;i<4;i++){s+='<rect x="'+(52+i*24)+'" y="'+(74+(i===1||i===2?-6:0))+'" width="24" height="56" rx="12" '+a+'/>';}
    s+='<rect x="52" y="138" width="78" height="30" rx="15" transform="rotate(-8 90 150)" '+a+'/>';
    s+='<path d="M64 108v14M88 100v14M112 100v14M136 108v14" '+b+'/>';
    s+='<rect x="64" y="208" width="72" height="26" rx="6" fill="'+SH+'" stroke="'+ST+'" stroke-width="3"/>';
  }else{
    s+='<rect x="82" y="14" width="22" height="130" rx="11" transform="rotate(-9 93 120)" '+a+'/>';
    s+='<rect x="106" y="20" width="22" height="124" rx="11" transform="rotate(9 117 120)" '+a+'/>';
    s+='<rect x="48" y="104" width="104" height="108" rx="36" '+a+'/>';
    s+='<rect x="56" y="102" width="24" height="52" rx="12" '+a+'/>';
    s+='<rect x="130" y="108" width="22" height="48" rx="11" '+a+'/>';
    s+='<rect x="60" y="146" width="76" height="28" rx="14" transform="rotate(6 98 160)" '+a+'/>';
    s+='<path d="M68 114v14M141 118v12" '+b+'/>';
    s+='<rect x="64" y="208" width="72" height="26" rx="6" fill="'+SH+'" stroke="'+ST+'" stroke-width="3"/>';
  }
  return s+'</svg>';
}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fa(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
var app=document.getElementById('app');

function scoreBar(){
  return '<div class="gname">'+esc(S.group)+'</div><div class="score"><div>'+esc(S.n[0])+'<b>'+fa(S.score[0])+'</b></div><div>'+esc(S.n[1])+'<b>'+fa(S.score[1])+'</b></div></div>';
}
function render(){
  var h='';
  if(S.step==='setup'){
    h='<h1>بەرد، کاغەز، مقەست</h1><p class="sub">یاری دوو کەسی لەسەر یەک مۆبایل</p><div class="card">'+
    '<label>ناوی گروپ</label><input id="g" value="'+esc(S.group)+'" placeholder="ناوی گروپەکە بنووسە">'+
    '<label>ناوی یاریزانی یەکەم</label><input id="p0" value="'+esc(S.n[0])+'" placeholder="ناو">'+
    '<label>ناوی یاریزانی دووەم</label><input id="p1" value="'+esc(S.n[1])+'" placeholder="ناو">'+
    '<button class="btn" onclick="start()">دەستپێکردن</button></div>';
  }else if(S.step==='pass'){
    h=scoreBar()+'<div class="card center"><p class="sub" style="margin-bottom:4px">مۆبایلەکە بدە بە</p><div class="big">'+esc(S.n[S.cur])+'</div>'+
    '<p class="sub">تەنیا ڕووی شاشەکە لە خۆت بێت، با ئەوی تر نەیبینێت</p><button class="btn" onclick="go(\'pick\')">ئامادەم</button></div>';
  }else if(S.step==='pick'){
    h=scoreBar()+'<div class="card"><div class="center big">'+esc(S.n[S.cur])+'، هەڵبژێرە</div><div class="picks">';
    ['rock','paper','scissors'].forEach(function(t){
      h+='<button class="pick'+(S.sel===t?' sel':'')+'" onclick="sel(\''+t+'\')">'+hand(t)+'<span>'+NAME[t]+'</span></button>';
    });
    h+='</div><button class="btn" '+(S.sel?'':'disabled')+' onclick="confirmPick()">دڵنیابوونەوە</button></div>';
  }else if(S.step==='count'){
    h=scoreBar()+'<div class="count" id="c">٣</div>';
  }else if(S.step==='result'){
    var a=S.pick[0],b=S.pick[1],r=0,why='';
    if(a!==b){
      var beat={rock:'scissors',scissors:'paper',paper:'rock'};
      r=beat[a]===b?1:2;var w=r===1?a:b;
      why={rock:'بەرد مقەست دەشکێنێت',paper:'کاغەز بەرد دادەپۆشێت',scissors:'مقەست کاغەز دەبڕێت'}[w];
    }
    h=scoreBar()+'<div class="vs"><div class="side'+(r===1?' win':r===2?' lose':'')+'">'+hand(a)+'<div class="big">'+NAME[a]+'</div>'+esc(S.n[0])+'</div>'+
    '<div class="side'+(r===2?' win':r===1?' lose':'')+'">'+hand(b)+'<div class="big">'+NAME[b]+'</div>'+esc(S.n[1])+'</div></div>'+
    '<div class="res">'+(r===0?'یەکسان بوون':esc(S.n[r-1])+' بردییەوە')+'</div><p class="why">'+(why||'هەردووکتان یەک شتتان هەڵبژاردووە')+'</p>'+
    '<button class="btn" onclick="again()">جارێکی تر</button><button class="btn alt" onclick="reset()">گۆڕینی ناوەکان</button>';
  }
  app.innerHTML=h;
}
function val(id){return document.getElementById(id).value.trim()}
function start(){
  S.group=val('g')||'گروپی من';S.n=[val('p0')||'یاریزانی یەکەم',val('p1')||'یاریزانی دووەم'];
  S.score=[0,0];again();
}
function again(){S.pick=[null,null];S.cur=0;S.sel=null;S.step='pass';render()}
function reset(){S.step='setup';render()}
function go(s){S.step=s;render()}
function sel(t){S.sel=t;render()}
function confirmPick(){
  S.pick[S.cur]=S.sel;S.sel=null;
  if(S.cur===0){S.cur=1;S.step='pass';render();}
  else{S.step='count';render();var n=3;
    var t=setInterval(function(){n--;
      if(n>0){var c=document.getElementById('c');c.textContent=fa(n);c.style.animation='none';void c.offsetWidth;c.style.animation='';}
      else{clearInterval(t);finish();}
    },850);}
}
function finish(){
  var beat={rock:'scissors',scissors:'paper',paper:'rock'},a=S.pick[0],b=S.pick[1];
  if(a!==b){if(beat[a]===b)S.score[0]++;else S.score[1]++;}
  S.step='result';render();
}
render();
</script>
</body>
</html>
